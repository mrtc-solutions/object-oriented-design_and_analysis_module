name: Validate teaching and examination documents

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, arena/e3546baf-object-oriented-design-and-ana]

permissions:
  contents: read

jobs:
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install tested dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify checked-in copies and checksums
        run: |
          python tools/validate_deliverables.py
          python -m unittest discover -s tests -v
      - name: Rebuild Week 15, Week 16 and examination documents
        run: |
          python tools/build_all.py 15
          python tools/build_all.py 16
          python tools/build_exam_docs.py
      - name: Verify rebuilt document content, layout and structure
        run: |
          python tools/validate_deliverables.py --write-checksums
          python -m unittest discover -s tests -v
      - name: Upload rebuilt distribution copies
        uses: actions/upload-artifact@v4
        with:
          name: BICT3202-reviewed-deliverables
          path: |
            output/week15/
            output/week16/
            output/exams/
            output/checksums.sha256
          if-no-files-found: error
          retention-days: 14
